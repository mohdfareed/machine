name: homelab-dashboard

# Homepage - Homelab Dashboard

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    labels:
      homepage.group: Services
      homepage.name: Dashboard
      homepage.icon: mdi-home-analytics
      homepage.href: https://dashboard.${TAILNET_NAME:?}.ts.net
      homepage.description: Homelab dashboard
    volumes:
      - type: bind
        source: ./config
        target: /config-source
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MC_HOMELAB_STORAGE_DIR:?}/homepage
        target: /app/config
        bind:
          create_host_path: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false

    # Copy managed YAML before startup; keep custom files and logs in local state.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /config-source/bookmarks.yaml /app/config/bookmarks.yaml
        cp /config-source/docker.yaml /app/config/docker.yaml
        cp /config-source/dashboard.yaml /app/config/services.yaml
        cp /config-source/settings.yaml /app/config/settings.yaml
        cp /config-source/widgets.yaml /app/config/widgets.yaml
        exec docker-entrypoint.sh node server.js
    environment:
      HOMEPAGE_ALLOWED_HOSTS: dashboard.${TAILNET_NAME:?}.ts.net
      HOMEPAGE_VAR_TITLE: ${HOMEPAGE_TITLE:?}
      HOMEPAGE_VAR_FAVICON: ${HOMEPAGE_FAVICON:?}
      HOMEPAGE_VAR_TAILNET_NAME: ${TAILNET_NAME:?}
      HOMEPAGE_VAR_TAILSCALE_API_KEY: ${TAILSCALE_API_KEY:?}
      HOMEPAGE_VAR_TAILSCALE_HOMELAB_DEVICE_ID: ${TAILSCALE_HOMELAB_DEVICE_ID:?}
      HOMEPAGE_VAR_TAILSCALE_PC_DEVICE_ID: ${TAILSCALE_PC_DEVICE_ID:?}
      HOMEPAGE_VAR_TAILSCALE_TV_DEVICE_ID: ${TAILSCALE_TV_DEVICE_ID:?}

networks:
  default:
    name: homelab
    external: true

# CLIProxyAPI - multi-provider LLM API proxy
# Access: https://model-gateway.<tailnet>.ts.net (tailnet only)

services:
  ts-cliproxyapi:
    image: tailscale/tailscale:latest
    container_name: ts-cliproxyapi
    hostname: model-gateway
    environment:
      TS_AUTHKEY: ${TS_DOCKER_AUTHKEY}
      TS_ACCEPT_DNS: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_HOSTNAME: model-gateway
      TS_SERVE_CONFIG: /config/serve.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ts-cliproxyapi-state:/var/lib/tailscale
      - ./ts-config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  cliproxyapi:
    image: eceasy/cli-proxy-api:v7.2.113
    container_name: cliproxyapi
    network_mode: service:ts-cliproxyapi
    depends_on:
      - ts-cliproxyapi
    environment:
      # Use at: https://model-gateway.<tailnet>.ts.net/management.html
      MANAGEMENT_PASSWORD: ${CLIPROXYAPI_MANAGEMENT_PASSWORD:?required}
      TZ: ${HOMELAB_TIMEZONE:?HOMELAB_TIMEZONE must be set}
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./data/auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
      - ./data/plugins:/CLIProxyAPI/plugins
    restart: unless-stopped
    labels:
      - homepage.group=Services
      - homepage.name=Model Gateway
      - homepage.icon=mdi-hub
      - homepage.href=https://model-gateway.${TAILNET_NAME}.ts.net/management.html
      - homepage.description=Unified API gateway for AI providers

  whisper-router:
    image: caddy:2-alpine
    container_name: cliproxyapi-whisper-router
    network_mode: service:ts-cliproxyapi
    depends_on:
      - ts-cliproxyapi
    command:
      - caddy
      - reverse-proxy
      - --from
      - http://127.0.0.1:8080
      - --to
      - http://homelab.${TAILNET_NAME:?TAILNET_NAME must be set}.ts.net:8081
    restart: unless-stopped

volumes:
  ts-cliproxyapi-state:

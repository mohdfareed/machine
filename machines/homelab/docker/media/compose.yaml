# Media - acquisition, organization, subtitles, and playback
# Access: private Tailscale hostnames only

x-tailscale-environment: &tailscale-environment
  TS_AUTHKEY: ${TS_DOCKER_AUTHKEY}
  TS_EXTRA_ARGS: --advertise-tags=tag:container
  TS_SERVE_CONFIG: /config/serve.json
  TS_STATE_DIR: /var/lib/tailscale
  TS_USERSPACE: "false"

x-tailscale-service: &tailscale-service
  image: tailscale/tailscale:latest
  environment: *tailscale-environment
  devices:
    - /dev/net/tun:/dev/net/tun
  cap_add:
    - net_admin
  restart: unless-stopped

services:
  # MARK: Tailscale

  ts-plex:
    <<: *tailscale-service
    container_name: ts-plex
    hostname: plex
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: plex
    volumes:
      - ts-plex-state:/var/lib/tailscale
      - ./ts-config/plex:/config

  ts-scryer:
    <<: *tailscale-service
    container_name: ts-scryer
    hostname: scryer
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: scryer
    volumes:
      - ts-scryer-state:/var/lib/tailscale
      - ./ts-config/scryer:/config

  ts-weaver:
    <<: *tailscale-service
    container_name: ts-weaver
    hostname: weaver
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: weaver
    volumes:
      - ts-weaver-state:/var/lib/tailscale
      - ./ts-config/weaver:/config

  # MARK: Services

  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: service:ts-plex
    depends_on:
      - ts-plex
    restart: unless-stopped
    environment:
      TZ: ${MC_HOMELAB_TIMEZONE:?MC_HOMELAB_TIMEZONE must be set}
      PLEX_CLAIM: "${PLEX_CLAIM:-}"
      ADVERTISE_IP: https://plex.${TAILNET_NAME}.ts.net/
    volumes:
      - ./data/plex:/config
      - ${MC_HOMELAB_STORAGE_DIR:?MC_HOMELAB_STORAGE_DIR must be set}/plex-transcode:/transcode
      - type: bind
        source: ${MC_HOMELAB_MEDIA_DIR:?MC_HOMELAB_MEDIA_DIR must be set}
        target: /data
        bind:
          create_host_path: false
    labels:
      homepage.group: Media
      homepage.name: Plex
      homepage.id: media-plex
      homepage.icon: mdi-plex
      homepage.href: https://plex.${TAILNET_NAME}.ts.net
      homepage.description: Media server

  scryer:
    image: ghcr.io/scryer-media/scryer:0.19.12
    container_name: scryer
    network_mode: service:ts-scryer
    depends_on:
      - ts-scryer
    restart: unless-stopped
    environment:
      TZ: ${MC_HOMELAB_TIMEZONE:?MC_HOMELAB_TIMEZONE must be set}
      PUID: "${PUID:-501}"
      PGID: "${PGID:-20}"
      # Passwordless access requires loopback plus TLS-terminated TCP Serve.
      SCRYER_BIND: 127.0.0.1:8080
      SCRYER_AUTH_ENABLED: "false"
      SCRYER_PUBLIC_URL: https://scryer.${TAILNET_NAME}.ts.net

    volumes:
      - ./data/scryer:/config
      - type: bind
        source: ${MC_HOMELAB_MEDIA_DIR:?MC_HOMELAB_MEDIA_DIR must be set}
        target: /data
        bind:
          create_host_path: false
    labels:
      homepage.group: Media
      homepage.name: Scryer
      homepage.icon: mdi-movie-search
      homepage.href: https://scryer.${TAILNET_NAME}.ts.net
      homepage.description: Movies, series, and subtitles

  weaver:
    image: ghcr.io/scryer-media/weaver:latest
    container_name: weaver
    network_mode: service:ts-weaver
    depends_on:
      - ts-weaver
    restart: unless-stopped
    environment:
      TZ: ${MC_HOMELAB_TIMEZONE:?MC_HOMELAB_TIMEZONE must be set}
      PUID: "${PUID:-501}"
      PGID: "${PGID:-20}"
      UMASK: "022"

      WEAVER_HTTP_ALLOWED_HOSTS: "weaver,ts-weaver,weaver.${TAILNET_NAME}.ts.net"
      WEAVER_INTERMEDIATE_DIR: /data/downloads/incomplete
      WEAVER_COMPLETE_DIR: /data/downloads/complete
    volumes:
      - ./data/weaver:/config
      - type: bind
        source: ${MC_HOMELAB_MEDIA_DIR:?MC_HOMELAB_MEDIA_DIR must be set}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: wget -q -T 3 -O /dev/null http://127.0.0.1:9090/readyz || exit 1
      start_period: 20s
      timeout: 5s
      interval: 30s
      retries: 3
    labels:
      homepage.group: Media
      homepage.name: Weaver
      homepage.icon: mdi-download-network
      homepage.href: https://weaver.${TAILNET_NAME}.ts.net
      homepage.description: Usenet downloader

  # MARK: Infrastructure

  plex-watchlist-sync:
    build:
      context: https://github.com/mohdfareed/plex-watchlist-sync.git
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    stop_grace_period: 1m
    volumes:
      - watchlist-sync-state:/config
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  ts-plex-state:
  ts-scryer-state:
  ts-weaver-state:
  watchlist-sync-state:

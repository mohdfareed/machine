# Media - acquisition, organization, subtitles, and playback

include:
  - compose.tailscale.yaml

x-app-env: &app-env
  TZ: ${MC_HOMELAB_TIMEZONE:?}
  PUID: "${PUID:-501}"
  PGID: "${PGID:-20}"
  # plex only
  PLEX_UID: "${PUID:-501}"
  PLEX_GID: "${PGID:-20}"

x-media-volume: &media-volume
  type: bind
  source: ${MC_HOMELAB_MEDIA_DIR:?}
  target: /data
  bind:
    create_host_path: false

services:
  # ===========================================================================
  # MARK: Services
  # ===========================================================================

  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: service:ts-plex
    depends_on:
      - ts-plex
    restart: unless-stopped
    environment:
      <<: *app-env
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      ADVERTISE_IP: https://plex.${TAILNET_NAME}.ts.net
    volumes:
      - <<: *media-volume
      - ./data/plex:/config
      - ${MC_HOMELAB_CACHE_DIR}/plex-transcode:/transcode
    labels:
      homepage.group: Media
      homepage.name: Plex
      homepage.id: media-plex
      homepage.icon: mdi-plex
      homepage.href: https://plex.${TAILNET_NAME}.ts.net
      homepage.description: Media server

  scryer:
    image: ghcr.io/scryer-media/scryer:latest
    container_name: scryer
    network_mode: service:ts-scryer
    depends_on:
      - ts-scryer
    restart: unless-stopped
    environment:
      <<: *app-env
      SCRYER_PUBLIC_URL: https://scryer.${TAILNET_NAME}.ts.net
    volumes:
      - <<: *media-volume
      - ./data/scryer:/config
    labels:
      homepage.group: Media
      homepage.name: Scryer
      homepage.icon: mdi-movie-search
      homepage.href: https://scryer.${TAILNET_NAME}.ts.net
      homepage.description: Movies, series, and subtitles

  weaver:
    image: ghcr.io/scryer-media/weaver:latest
    container_name: weaver
    network_mode: service:ts-weaver
    depends_on:
      - ts-weaver
    restart: unless-stopped
    environment:
      <<: *app-env
      WEAVER_HTTP_ALLOWED_HOSTS: "ts-weaver,weaver.${TAILNET_NAME}.ts.net"
    volumes:
      - <<: *media-volume
      - ./data/weaver:/config
    healthcheck:
      test: wget -q -T 3 -O /dev/null http://127.0.0.1:9090/readyz || exit 1
    labels:
      homepage.group: Media
      homepage.name: Weaver
      homepage.icon: mdi-cloud-download
      homepage.href: https://weaver.${TAILNET_NAME}.ts.net
      homepage.description: Usenet downloader

  # ===========================================================================
  # MARK: Infrastructure
  # ===========================================================================

  watchlist-sync:
    build:
      context: https://github.com/mohdfareed/watchlist-sync.git
      dockerfile: docker/Dockerfile
    container_name: watchlist-sync
    restart: unless-stopped
    stop_grace_period: 1m # allow for graceful syncing
    user: "${PUID:-501}:${PGID:-20}"
    environment:
      <<: *app-env
      PLEX_SERVER_URL: https://plex.${TAILNET_NAME:?}.ts.net
      SCRYER_URL: https://scryer.${TAILNET_NAME:?}.ts.net
      # Allow core-only bootstrap before creating this key; set it before starting sync.
      SCRYER_API_KEY: "${SCRYER_API_KEY:-}"
    volumes:
      - ./data/watchlist-sync:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

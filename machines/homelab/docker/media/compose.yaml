# Media - requests, acquisition, organization, subtitles, and playback
# Access: private Tailscale hostnames only

x-tailscale-environment: &tailscale-environment
  TS_AUTHKEY: ${TS_DOCKER_AUTHKEY}
  TS_EXTRA_ARGS: --advertise-tags=tag:container
  TS_SERVE_CONFIG: /config/serve.json
  TS_STATE_DIR: /var/lib/tailscale
  TS_USERSPACE: "false"

x-service-environment: &service-environment
  TZ: ${MC_HOMELAB_TIMEZONE:?MC_HOMELAB_TIMEZONE must be set}

x-media-labels: &media-labels
  homepage.group: Media

x-media-automation-labels: &media-automation-labels
  homepage.group: Media Infrastructure

x-tailscale-service: &tailscale-service
  image: tailscale/tailscale:latest
  environment: *tailscale-environment
  devices:
    - /dev/net/tun:/dev/net/tun
  cap_add:
    - net_admin
  restart: unless-stopped

services:
  # MARK: Tailscale

  ts-arr-dashboard:
    <<: *tailscale-service
    container_name: ts-arr-dashboard
    hostname: arr-dashboard
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: arr-dashboard
    volumes:
      - ts-arr-dashboard-state:/var/lib/tailscale
      - ./ts-config/arr-dashboard:/config

  ts-plex:
    <<: *tailscale-service
    container_name: ts-plex
    hostname: plex
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: plex
    volumes:
      - ts-plex-state:/var/lib/tailscale
      - ./ts-config/plex:/config

  ts-seerr:
    <<: *tailscale-service
    container_name: ts-seerr
    hostname: seerr
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: seerr
    volumes:
      - ts-seerr-state:/var/lib/tailscale
      - ./ts-config/seerr:/config

  ts-prowlarr:
    <<: *tailscale-service
    container_name: ts-prowlarr
    hostname: prowlarr
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: prowlarr
    volumes:
      - ts-prowlarr-state:/var/lib/tailscale
      - ./ts-config/prowlarr:/config

  ts-radarr:
    <<: *tailscale-service
    container_name: ts-radarr
    hostname: radarr
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: radarr
    volumes:
      - ts-radarr-state:/var/lib/tailscale
      - ./ts-config/radarr:/config

  ts-sonarr:
    <<: *tailscale-service
    container_name: ts-sonarr
    hostname: sonarr
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: sonarr
    volumes:
      - ts-sonarr-state:/var/lib/tailscale
      - ./ts-config/sonarr:/config

  ts-bazarr:
    <<: *tailscale-service
    container_name: ts-bazarr
    hostname: bazarr
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: bazarr
    volumes:
      - ts-bazarr-state:/var/lib/tailscale
      - ./ts-config/bazarr:/config

  ts-weaver:
    <<: *tailscale-service
    container_name: ts-weaver
    hostname: weaver
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: weaver
    volumes:
      - ts-weaver-state:/var/lib/tailscale
      - ./ts-config/weaver:/config

  # MARK: Services

  arr-dashboard:
    image: khak1s/arr-dashboard:latest
    container_name: arr-dashboard
    network_mode: service:ts-arr-dashboard
    depends_on:
      - ts-arr-dashboard
    restart: unless-stopped
    mem_limit: 3g
    environment:
      <<: *service-environment
      PUID: "${PUID:-501}"
      PGID: "${PGID:-20}"
      APP_URL: https://arr-dashboard.${TAILNET_NAME}.ts.net
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      WEBAUTHN_RP_ID: arr-dashboard.${TAILNET_NAME}.ts.net
      WEBAUTHN_ORIGIN: https://arr-dashboard.${TAILNET_NAME}.ts.net
    volumes:
      - ./data/arr-dashboard:/config
    labels:
      <<: *media-labels
      homepage.name: Arr Dashboard
      homepage.icon: mdi-view-dashboard
      homepage.href: https://arr-dashboard.${TAILNET_NAME}.ts.net
      homepage.description: Media automation dashboard

  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: service:ts-plex
    depends_on:
      - ts-plex
    restart: unless-stopped
    environment:
      <<: *service-environment
      PLEX_CLAIM: "${PLEX_CLAIM:-}"
      ADVERTISE_IP: https://plex.${TAILNET_NAME}.ts.net/
    volumes:
      - ./data/plex:/config
      - type: bind
        source: ${MC_HOMELAB_STORAGE_DIR:?MC_HOMELAB_STORAGE_DIR must be set}/plex-transcode
        target: /transcode
        bind:
          create_host_path: true
      - type: bind
        source: ${MC_HOMELAB_MEDIA_DIR:?MC_HOMELAB_MEDIA_DIR must be set}
        target: /data
        bind:
          create_host_path: false
    labels:
      <<: *media-labels
      homepage.name: Plex
      homepage.id: media-plex
      homepage.icon: mdi-plex
      homepage.href: https://plex.${TAILNET_NAME}.ts.net
      homepage.description: Media server

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    network_mode: service:ts-seerr
    depends_on:
      - ts-seerr
    restart: unless-stopped
    environment: *service-environment
    volumes:
      - ./data/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      <<: *media-labels
      homepage.name: Seerr
      homepage.id: media-seerr
      homepage.icon: mdi-movie-search
      homepage.href: https://seerr.${TAILNET_NAME}.ts.net
      homepage.description: Media management

  weaver:
    image: ghcr.io/scryer-media/weaver:latest
    container_name: weaver
    network_mode: service:ts-weaver
    depends_on:
      - ts-weaver
    restart: unless-stopped
    environment:
      <<: *service-environment
      PUID: "${PUID:-501}"
      PGID: "${PGID:-20}"
      UMASK: "022"
      WEAVER_HTTP_BIND_ADDRESS: 0.0.0.0
      WEAVER_HTTP_ALLOWED_HOSTS: "weaver,ts-weaver,weaver.${TAILNET_NAME}.ts.net"
      WEAVER_INTERMEDIATE_DIR: /data/downloads/incomplete
      WEAVER_COMPLETE_DIR: /data/downloads/complete
    volumes:
      - ./data/weaver:/config
      - type: bind
        source: ${MC_HOMELAB_MEDIA_DIR:?MC_HOMELAB_MEDIA_DIR must be set}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: wget -q -T 3 -O /dev/null http://127.0.0.1:9090/readyz || exit 1
      start_period: 20s
      timeout: 5s
      interval: 30s
      retries: 3
    labels:
      <<: *media-labels
      homepage.name: Weaver
      homepage.icon: mdi-download-network
      homepage.href: https://weaver.${TAILNET_NAME}.ts.net
      homepage.description: Usenet downloader trial

  # MARK: Infrastructure

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:ts-prowlarr
    depends_on:
      - ts-prowlarr
    restart: unless-stopped
    environment: *service-environment
    volumes:
      - ./data/prowlarr:/config
    labels:
      <<: *media-automation-labels
      homepage.name: Prowlarr
      homepage.icon: mdi-magnify-scan
      homepage.href: https://prowlarr.${TAILNET_NAME}.ts.net
      homepage.description: Indexers
      homepage.showStats: "false"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: service:ts-radarr
    depends_on:
      - ts-radarr
    restart: unless-stopped
    environment: *service-environment
    volumes:
      - ./data/radarr:/config
      - type: bind
        source: ${MC_HOMELAB_MEDIA_DIR:?MC_HOMELAB_MEDIA_DIR must be set}
        target: /data
        bind:
          create_host_path: false
    labels:
      <<: *media-automation-labels
      homepage.name: Radarr
      homepage.icon: mdi-movie-open
      homepage.href: https://radarr.${TAILNET_NAME}.ts.net
      homepage.description: Movies
      homepage.showStats: "false"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: service:ts-sonarr
    depends_on:
      - ts-sonarr
    restart: unless-stopped
    environment: *service-environment
    volumes:
      - ./data/sonarr:/config
      - type: bind
        source: ${MC_HOMELAB_MEDIA_DIR:?MC_HOMELAB_MEDIA_DIR must be set}
        target: /data
        bind:
          create_host_path: false
    labels:
      <<: *media-automation-labels
      homepage.name: Sonarr
      homepage.icon: mdi-television-classic
      homepage.href: https://sonarr.${TAILNET_NAME}.ts.net
      homepage.description: TV shows
      homepage.showStats: "false"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: service:ts-bazarr
    depends_on:
      - ts-bazarr
    restart: unless-stopped
    environment: *service-environment
    volumes:
      - ./data/bazarr:/config
      - type: bind
        source: ${MC_HOMELAB_MEDIA_DIR:?MC_HOMELAB_MEDIA_DIR must be set}
        target: /data
        bind:
          create_host_path: false
    labels:
      <<: *media-automation-labels
      homepage.name: Bazarr
      homepage.icon: mdi-subtitles
      homepage.href: https://bazarr.${TAILNET_NAME}.ts.net
      homepage.description: Subtitles
      homepage.showStats: "false"

  bazarr-whisper-adapter:
    build:
      context: ./bazarr-whisper-adapter
    container_name: bazarr-whisper-adapter
    network_mode: service:ts-bazarr
    depends_on:
      - ts-bazarr
    environment:
      WHISPER_URL: http://host.docker.internal:8081/v1/audio/transcriptions
    restart: unless-stopped

volumes:
  ts-arr-dashboard-state:
  ts-plex-state:
  ts-seerr-state:
  ts-prowlarr-state:
  ts-radarr-state:
  ts-sonarr-state:
  ts-bazarr-state:
  ts-weaver-state:

[program:wake-pc]
directory = $directory
command = $waitress
    --host=127.0.0.1
    --port=$port
    --threads=1
    --channel-timeout=$timeout
    --max-request-body-size=0
    wake_pc:app
autorestart = true
stopasgroup = true
redirect_stderr = true
stdout_logfile = %(ENV_HOME)s/Library/Logs/homepage-wake-pc.log

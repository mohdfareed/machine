[project]
name = "machine"
version = "0.4.0"
description = "Machine setup CLI app."
readme = "README.md"

# =============================================================================
# MARK: Dependencies
# =============================================================================

requires-python = ">=3.14"
dependencies = [
    "click>=8.5",
    "rich>=15.0",
    "typer>=0.27",
    "pydantic>=2.13",
]

[dependency-groups]
dev = [
    "codespell>=2.4",
    "pyright>=1.1",
    "pytest>=9.1",
    "ruff>=0.16",
    "shellcheck-py>=0.11",
]

# =============================================================================
# MARK: Build System
# =============================================================================

[project.scripts]
mc = "app.cli.entry:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app"]
module-root = ""

# =============================================================================
# MARK: Tool Configuration
# =============================================================================

[tool.ruff]
line-length = 100
src = [".", "config", "machines"]

[tool.ruff.lint]
select = ["E", "I", "W", "RUF"]

[tool.codespell]
skip = "*.lock,*.json,*.plist,compose.yaml,.git,.venv,**/data/**,**/logs/**,config/**/scripts/**,config/**/module.py,machines/**/scripts/**,machines/**/manifest.py"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
useLibraryCodeForTypes = true

[tool.pytest.ini_options]
testpaths = ["tests"]

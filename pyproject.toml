[project]
name = "machine"
version = "1.2.3"
description = "Machine setup CLI app."
readme = "README.md"

# ═════════════════════════════════════════════════════════════════════════════
# MARK: Dependencies
# ═════════════════════════════════════════════════════════════════════════════

requires-python = ">=3.14"
dependencies = [
  "click>=8.5",
  "rich>=15.0",
  "typer>=0.27",
  "pydantic>=2.14",
  "platformdirs>=4",
]

[dependency-groups]
dev = [
  "flask>=3.1", # test local servers (e.g. wake-pc)
  "pyright>=1.1",
  "pytest>=9.1",
  "ruff>=0.17",
  "shellcheck-py>=0.11",
  "typos>=1.50",
]

# ═════════════════════════════════════════════════════════════════════════════
# MARK: Build System
# ═════════════════════════════════════════════════════════════════════════════

[project.scripts]
mc = "app.cli.entry:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app"]
module-root = ""

# ═════════════════════════════════════════════════════════════════════════════
# MARK: Tool Configuration
# ═════════════════════════════════════════════════════════════════════════════

[tool.ruff]
line-length = 100
src = ["app", "config", "machines"]
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "W", "I", "UP", "RUF"]

[tool.pyright]
exclude = [
  "archive",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true

[tool.pytest.ini_options]
testpaths = ["tests"]

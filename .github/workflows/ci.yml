name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})

    # Check all supported platforms in parallel.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    # Run the check on each platform.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true

      # Cache the virtual environment.
      - uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock', 'scripts/check.*') }}
      - run: uv sync --dev --locked

      # Unix-based checks.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
          ./scripts/check.sh

      # Windows-based checks.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1

name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})

    # MARK: Setup
    # ═══════════════════════════════════════════════════════════════════════

    # Check native macOS and Windows; tests also resolve WSL declarations.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    # Run the check on each platform.
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7

      - name: Set up uv
        id: uv_setup
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up dependencies
        id: dependencies_setup
        run: uv sync --dev --locked

      - name: Set up macOS tools
        id: macos_tools
        if: ${{ !cancelled() && steps.dependencies_setup.outcome == 'success' && runner.os == 'macOS' }}
        run: brew install --cask powershell@preview

      # MARK: Checks
      # ═══════════════════════════════════════════════════════════════════════

      - name: Check dependencies
        id: dependencies
        if: ${{ !cancelled() && steps.dependencies_setup.outcome == 'success' }}
        run: uv run --no-sync python scripts/checks/dependencies.py

      - name: Check code, tests, and spelling
        id: code
        if: ${{ !cancelled() && steps.dependencies_setup.outcome == 'success' }}
        env:
          RUFF_OUTPUT_FORMAT: github
          PYTEST_ADDOPTS: --junitxml=.reports/pytest.xml
        run: uv run --no-sync python scripts/checks/code.py

      - name: Check shell scripts
        id: scripts
        if: >-
          ${{ !cancelled() && steps.dependencies_setup.outcome == 'success' &&
              (runner.os == 'Windows' || steps.macos_tools.outcome == 'success') }}
        run: uv run --no-sync python scripts/checks/scripts.py

      # MARK: Reporting
      # ═══════════════════════════════════════════════════════════════════════

      - name: Upload test report
        id: test_report
        if: ${{ always() && hashFiles('.reports/pytest.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ runner.os }}
          path: .reports/pytest.xml
          include-hidden-files: true

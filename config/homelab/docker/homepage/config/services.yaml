---
# Non-container service entries. Docker containers are auto-discovered via
# homepage.* labels in their compose files.

- Machines:
    - Homelab:
      icon: mdi-home-analytics
      description: MacBook Air
      href: http://homelab.{{HOMEPAGE_VAR_TAILNET_NAME}}.ts.net
      widget:
        type: tailscale
        deviceid: "{{HOMEPAGE_VAR_TAILSCALE_HOMELAB_DEVICE_ID}}"
        key: "{{HOMEPAGE_VAR_TAILSCALE_API_KEY}}"
        fields: ["address", "last_seen", "expires"]
    - PC:
      icon: mdi-desktop-tower
      description: Desktop PC
      href: http://pc.{{HOMEPAGE_VAR_TAILNET_NAME}}.ts.net
      widget:
        type: tailscale
        deviceid: "{{HOMEPAGE_VAR_TAILSCALE_PC_DEVICE_ID}}"
        key: "{{HOMEPAGE_VAR_TAILSCALE_API_KEY}}"
        fields: ["address", "last_seen", "expires"]
    - TV:
      icon: mdi-television
      description: Apple TV
      href: http://apple-tv.{{HOMEPAGE_VAR_TAILNET_NAME}}.ts.net:5252
      widget:
        type: tailscale
        deviceid: "{{HOMEPAGE_VAR_TAILSCALE_TV_DEVICE_ID}}"
        key: "{{HOMEPAGE_VAR_TAILSCALE_API_KEY}}"
        fields: ["address", "last_seen", "expires"]

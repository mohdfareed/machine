# Homepage - Homelab Dashboard

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
      HOMEPAGE_VAR_TITLE: ${HOMEPAGE_TITLE}
      HOMEPAGE_VAR_FAVICON: ${HOMEPAGE_FAVICON}
      HOMEPAGE_VAR_TAILNET_NAME: ${TAILNET_NAME:?}
